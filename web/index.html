<!doctype html>
<html><head><meta charset="utf-8"><title>Food Truck Router</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
 body{margin:0;font-family:system-ui,sans-serif;display:flex;height:100vh}
 #side{width:360px;padding:16px;overflow:auto;box-sizing:border-box;border-right:1px solid #ddd}
 #map{flex:1} select,button{width:100%;padding:8px;margin:4px 0;font-size:15px}
 .card{border:1px solid #ddd;border-radius:8px;padding:10px;margin:8px 0;cursor:pointer}
 .card.best{border-color:#16a34a;background:#f0fdf4}
 #brief{background:#f5f5f5;border-radius:8px;padding:10px;margin-top:10px;font-size:14px}
 @media(max-width:700px){body{flex-direction:column-reverse}#side{width:100%;height:45vh}}
</style></head><body>
<div id="side">
  <h3>🚚 Food Truck Router</h3>
  <select id="from"></select><select id="to"></select>
  <button id="go">Find best route</button>
  <div id="routes"></div><div id="brief"></div>
</div>
<div id="map"></div>
<script>
const map=L.map('map').setView([22.3,72.6],7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
let layers=[];
const $=id=>document.getElementById(id);
fetch('/api/godowns').then(r=>r.json()).then(gs=>{
  for(const s of [$('from'),$('to')]) gs.forEach(g=>s.add(new Option(g.name,g.id)));
  $('to').selectedIndex=1;
  gs.forEach(g=>L.marker([g.lat,g.lon]).addTo(map).bindTooltip(g.name));
});
function draw(routes,sel){
  layers.forEach(l=>map.removeLayer(l));layers=[];
  routes.forEach((r,i)=>{
    const l=L.geoJSON(r.geometry,{style:{color:i===sel?'#16a34a':'#9ca3af',weight:i===sel?6:4,opacity:i===sel?1:.7}}).addTo(map);
    layers.push(l); if(i===sel){l.bringToFront();map.fitBounds(l.getBounds())}
  });
}
$('go').onclick=async()=>{
  $('routes').innerHTML='Loading…';$('brief').textContent='';
  const res=await fetch(`/api/route?from_id=${$('from').value}&to_id=${$('to').value}`);
  if(!res.ok){$('routes').textContent='Error: '+(await res.text());return}
  const d=await res.json();
  $('routes').innerHTML=d.routes.map((r,i)=>`<div class="card ${r.best?'best':''}" data-i="${i}">
    <b>${r.label}${r.best?' ✅ Best':''}</b><br>${r.minutes} min · ${r.km} km<br>
    <small>via ${r.main_roads.join(', ')}</small></div>`).join('');
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>draw(d.routes,+c.dataset.i));
  $('brief').textContent=d.brief||'(AI brief unavailable — model may still be loading)';
  draw(d.routes,0);
};
</script></body></html>
